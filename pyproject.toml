[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "High-performance multi-source business entity resolution pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "rapidfuzz",
    "catboost",
    "pyarrow",
    "sparse-dot-topn",
]

[tool.setuptools.packages.find]
where = ["src"]
